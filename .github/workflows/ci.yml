name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite never calls a real model, so no credential is needed. `APP_ENV=test` also keeps
  # the placeholder-rejection guard in `Settings` from firing.
  APP_ENV: test
  DATABASE_URL: "sqlite+aiosqlite:///./ci.db"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The `langgraph` extra is included so the comparative runner is linted, typed and
        # importable here too. It ships in the repository, and the one file written to
        # demonstrate rigour should not be the only file the gate skips.
        run: pip install -e ".[dev,langgraph]"

      - name: Default install needs no optional extra
        # Guards the property the extra exists to preserve: nothing on the default path may
        # start importing LangChain. A clean environment that can import the app proves it.
        run: |
          python -m venv /tmp/base-install
          /tmp/base-install/bin/pip install -q -e .
          /tmp/base-install/bin/python -c "import app.main; print('import da aplicacao OK sem o extra')"

      - name: Knowledge strategy guard (PRD 6.2 / 7.4)
        # Runs first and on its own: if a vector database ever creeps in, that is the finding,
        # and it should not be buried under a lint report.
        run: python scripts/check_no_vector_deps.py

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy app scripts

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Migrations match the models
        # Catches a model edited without a migration -- the failure that only shows up on
        # someone else's machine.
        run: |
          alembic upgrade head
          alembic check
