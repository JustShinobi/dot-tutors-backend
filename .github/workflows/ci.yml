name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite never calls a real model, so no credential is needed. `APP_ENV=test` also keeps
  # the placeholder-rejection guard in `Settings` from firing.
  APP_ENV: test
  DATABASE_URL: "sqlite+aiosqlite:///./ci.db"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The `langgraph` extra is included so the comparative runner is linted, typed and
        # importable here too. It ships in the repository, and the one file written to
        # demonstrate rigour should not be the only file the gate skips.
        run: pip install -e ".[dev,langgraph]"

      - name: Default install needs no optional extra
        # Guards the property the extra exists to preserve: nothing on the default path may
        # start importing LangChain. A clean environment that can import the app proves it.
        run: |
          python -m venv /tmp/base-install
          /tmp/base-install/bin/pip install -q -e .
          /tmp/base-install/bin/python -c "import app.main; print('import da aplicacao OK sem o extra')"

      - name: Knowledge strategy guard (PRD 6.2 / 7.4)
        # Runs first and on its own: if a vector database ever creeps in, that is the finding,
        # and it should not be buried under a lint report.
        run: python scripts/check_no_vector_deps.py

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy app scripts

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Migrations match the models
        # Catches a model edited without a migration -- the failure that only shows up on
        # someone else's machine.
        run: |
          alembic upgrade head
          alembic check

  postgres:
    name: Schema and tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The README claims the schema is dialect-agnostic. This is what turns that into a fact:
    # the suite normally runs on SQLite, so without this job nothing would ever exercise the
    # dialect the deployment actually uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutors
          POSTGRES_PASSWORD: tutors
          POSTGRES_DB: tutors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutors -d tutors"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql+asyncpg://tutors:tutors@localhost:5432/tutors"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrations apply cleanly on PostgreSQL
        run: |
          alembic upgrade head
          alembic check

      - name: Seed runs against PostgreSQL
        # Exercises the write path on the real dialect: enums, JSON columns and timestamptz.
        env:
          SEED_ADMIN_EMAIL: ci@example.com
          SEED_ADMIN_PASSWORD: senha-de-ci-nao-usada-em-lugar-nenhum
        run: python -m scripts.seed

      - name: Migrations roll back
        # A migration that cannot be undone is a migration you cannot deploy safely.
        run: alembic downgrade base

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The image is part of the deliverable now, so it is built on every push rather than being
    # a file nobody ever ran.
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dot-tutors-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and answers its liveness probe
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=local \
            -e DATABASE_URL=sqlite+aiosqlite:///./ci.db \
            dot-tutors-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "a API respondeu na tentativa $attempt"
              curl -fsS http://localhost:8000/readyz
              docker rm -f api
              exit 0
            fi
            sleep 2
          done
          echo "a API nao subiu"
          docker logs api
          exit 1
